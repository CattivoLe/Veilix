name: Release

# Push a tag like v1.1 to build a signed APK and publish a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Check that the tag matches versionName
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match versionName $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.VEILIX_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret VEILIX_KEYSTORE_BASE64 is not set, see RELEASING.md"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Test and build
        env:
          VEILIX_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          VEILIX_KEYSTORE_PASSWORD: ${{ secrets.VEILIX_KEYSTORE_PASSWORD }}
          VEILIX_KEY_ALIAS: ${{ secrets.VEILIX_KEY_ALIAS }}
          VEILIX_KEY_PASSWORD: ${{ secrets.VEILIX_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Verify signature and collect files
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          test -f "$apk" || { echo "::error::Signed APK not found"; exit 1; }
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "$apk" | tee signing.txt
          mkdir dist
          cp "$apk" "dist/Veilix-$VERSION.apk"
          (cd dist && sha256sum "Veilix-$VERSION.apk" > "Veilix-$VERSION.apk.sha256")
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk -v v="$VERSION" '
            $0 ~ "^## " v "( |$)" { on=1; next }
            on && /^## / { exit }
            on { print }' CHANGELOG.md)
          cert=$(grep -m1 'SHA-256 digest' signing.txt | sed 's/.*: //')
          printf '%s\n\n---\n\n**APK SHA-256:** `%s`\n\n**Signing certificate SHA-256:** `%s`\n' \
            "$notes" "$(cut -d' ' -f1 "dist/Veilix-$VERSION.apk.sha256")" "$cert" > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "Veilix $VERSION" --notes-file notes.md
